name: Cleanup active tracking components

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/cleanup_active_components.py'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run exact codemod
        run: python scripts/cleanup_active_components.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tracking.js src/AppV4.jsx src/UmzugsreinigungLanding.jsx src/FensterreinigungLanding.jsx src/SitePrivacyControls.jsx
          git diff --cached --quiet && exit 1
          git commit -m "Consolidate active tracking and consent ownership"
          git push origin HEAD:main
