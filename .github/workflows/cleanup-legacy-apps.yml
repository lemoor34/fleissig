name: Cleanup legacy app generations

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/cleanup_legacy_apps.marker'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Remove obsolete app generations and tests
        run: |
          rm -f src/App.jsx src/AppV2.jsx
          rm -f src/__tests__/App.test.jsx
          rm -f src/__tests__/AppV2.test.jsx
          rm -f src/__tests__/Calculator.test.jsx
          rm -f src/__tests__/FAQAccordion.test.jsx
          rm -f src/__tests__/Nav.test.jsx
          rm -f src/__tests__/config.test.js
          rm -f src/__tests__/utils.test.js

      - name: Remove unused runtime dependencies
        run: npm uninstall @formspree/react react-router-dom

      - name: Verify current production architecture
        run: npm run build

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Remove obsolete app generations and dependencies"
          git push origin HEAD:main
