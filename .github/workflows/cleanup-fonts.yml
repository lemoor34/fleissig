name: Cleanup third-party fonts

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/cleanup_fonts.py'

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Remove pre-consent Google Fonts requests
        run: python scripts/cleanup_fonts.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html umzugsreinigung-aargau/index.html fensterreinigung-aargau/index.html src/AppV4.jsx src/UmzugsreinigungLanding.jsx src/FensterreinigungLanding.jsx
          git diff --cached --quiet && exit 1
          git commit -m "Remove pre-consent Google Fonts requests"
          git push origin HEAD:main
