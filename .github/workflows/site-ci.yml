name: Site CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'umzugsreinigung-aargau/**'
      - 'fensterreinigung-aargau/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vercel.json'
      - '.github/workflows/site-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'umzugsreinigung-aargau/**'
      - 'fensterreinigung-aargau/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vercel.json'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build
